    classification_logic: '以“客观看待、摘掉滤镜”为合理幌子偷换逻辑，把“人物有普通人缺点”等同于“崇高贡献虚假”，割裂人物时代背景、牺牲行为与历史功绩，仅依靠个人细碎弱点消解整体历史评价，弱化大众英雄认同。

      1. 归入本子类门槛：

      文本以“抛开宣传滤镜、多角度客观看人”为名义，使用摘滤镜、拆解真实形象等话术，将英雄人物宣传中正常的形象塑造歪曲为刻意造神、虚假包装。匹配本子类任意梯度样本句式/关键词。

      2. 五级分层踩中判定细则

      低风险： 仅客观表述“评价人物需结合时代背景、全面看待优缺点”，使用唯物史观辩证评价语言，无“滤镜全是造假”“刻意拔高”等祛魅解构句式，纯历史教育科普语境。

      轻度风险： 仅提及“英雄人物也存在普通人性格短板”“可多角度阅读史料”，使用中性多元视角表述，不搭建“官方刻意造神 vs 真实人性”二元对立框架，无系统性否定英雄功绩推论。

      中度风险： 精准踩中【中度样本】句式（“抛开宣传滤镜，这个人没有传说中那么完美”“不能只看正面宣传”）；仅客观提及人物普通人特质，不编造功利动机、不否定整体历史贡献，无“宣传造假”强对立叙事。

      高风险： 精准踩中【高样本】句式/核心虚无关键词（“滤镜一拆全是算计”“所谓奉献只是时代给的包装”“真实动机并不纯粹”）；搭建“宣传美化 vs 真实私心”强对立叙事，主观揣测英雄功利动机；仅针对单个人物解构，不否定全部英雄体系。

      极高风险： 精准踩中【极高样本】句式/极端虚无关键词（“所有英雄滤镜全是人为塑造”“整套崇高叙事从头到尾都是宣传工具”“统一造神”）；由单个人物祛魅延伸至全盘否定整套爱国主义英雄叙事，系统性消解英雄谱系与红色价值体系。'
