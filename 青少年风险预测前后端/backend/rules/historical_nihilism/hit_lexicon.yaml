source_doc: 历史虚无命中规则-20260708.docx
categories:
- id: 1
  name: 揭秘/真相型
  subtitle: 制造神典型话语
  subtypes:
  - id: '1.1'
    name: 课本未讲型
    classification_logic: '专门依托中小学、通用历史教材为切入点，利用学生群体对课本的信任制造认知割裂；刻意放大教材篇幅取舍、简化表述，将正常科普简化歪曲为“主动隐瞒、刻意美化”；区分“盲从教材普通人”和“看透内幕少数人”，制造身份对立，逐步消解主流历史教育公信力。

      归入本子类门槛：文本以中小学历史教材、通史读本、课堂教学为唯一切入点，围绕教材篇幅删减、内容简化展开揭秘式表述，匹配本子类任意梯度样本句式 / 关键词。

      五级分层踩中判定细则

      低风险：仅客观说明教材受篇幅限制简化次要内容；无“刻意隐瞒、美化、篡改”任何虚无关键词；纯正向科普，不踩任意梯度样本。

      轻度风险：仅表述课本内容简略、可自行补充史料；仅使用纯中性描述词，未出现 “课本没细说、隐秘往事” 等浅层揭秘话术，无二元对立人群划分。

      中度风险：精准踩中【中度样本】全部句式 / 浅层关键词（课本没细说、隐秘往事、轻描淡写、删减背景）；仅客观描述教材篇幅取舍现象，不引申 “官方主动造假、刻意掩盖” 主观动机，无清醒 / 盲从人群对立。

      高风险：精准踩中【高样本】全部句式 / 核心虚无关键词（美化、洗脑、独立读者、看透内幕、少数人掌握细节）；搭建“盲从普通人 vs 清醒独立者”二元对立框架；仅质疑教材叙事加工，不上升否定国家发展道路、制度。

      极高风险：精准踩中【极高样本】全部句式 / 极端虚无关键词（篡改主线、系统性遮蔽、制度原生缺陷、道路根本性错误）；由教材删减现象推导整套发展路线、制度存在原生缺陷，形成全盘否定历史选择完整逻辑链。'
    hit_phrases:
      中度:
      - 历史书不会完整展开这段隐秘往事
      - 教科书大幅压缩关键事件篇幅，只保留简化版本
      - 课本刻意轻描淡写矛盾冲突类历史细节
      - 中小学教材选择性删减复杂历史背景
      - 官方通史读本回避争议性历史过程
      - 课堂教学只宣讲标准化正面叙事，略去另一面信息
      高:
      - 课本刻意美化过往史实，只有不盲从标准答案的人才能看透内幕
      - 教科书过滤残酷、矛盾的真实历史，普通人只会被课本思维洗脑
      - 教材统一加工叙事，刻意掩盖事件深层问题，独立读者才能发掘真相
      - 死读课本只会接受片面说辞，跳出教材框架才能看清完整脉络
      - 官方教材打造统一叙事模板，刻意回避历史短板，少数人掌握真实细节
      极高:
      - 整套近现代教材刻意篡改历史主线，掩盖发展道路根本性缺陷
      - 从小学到高中历史课本层层修饰，系统性遮蔽制度原生问题
      - 官方编纂通史统一粉化发展历程，刻意抹杀历史客观失误
      - 全国统一历史教科书构建虚假叙事，只为合理化固有发展路线
      - 教材体系自上而下筛选史实，刻意抹去路线存在深层矛盾
      - 教材刻意篡改近代历史，掩盖当年发展道路的根本性错误
    judged_examples:
    - risk_level: 低风险
      example_sentence: 历史教材受篇幅限制，会简化部分次要历史背景
      reasoning_text: '例句：历史教材受篇幅限制，会简化部分次要历史背景

        fact_handling=0（客观说明教材编写规则，无捏造隐瞒推论）

        narrative_frame=0（无任何对立叙事框架）

        emotional_mobilization=0（纯客观学术表述，无猎奇煽动）

        value_orientation=0（完全认可教材历史教育价值）

        expression_packaging=0（标准书面学术表达，无揭秘流量话术）

        youth_impact=0（理性科普，不会误导学生）

        总分 = 0+0+0+0+0+0=0 → 0-5 区间→低风险

        判定原因：仅客观说明教材编写客观局限，不存在任何“刻意隐瞒、篡改真相”虚无导向，无揭秘类包装话术，属于正常历史科普，判定低风险。'
    - risk_level: 轻度风险
      example_sentence: 课本里很多内容讲得比较简略，感兴趣可以自行查阅补充史料
      reasoning_text: '例句：课本里很多内容讲得比较简略，感兴趣可以自行查阅补充史料

        fact_handling=1（仅指出内容简略，无官方造假推论）

        narrative_frame=1（无对立阵营划分）

        emotional_mobilization=1（轻微引导拓展阅读，无怀疑煽动）

        value_orientation=1（认可教材核心史实）

        expression_packaging=2（轻微简化叙事，无完整揭秘标题套路）

        youth_impact=1（仅轻微引导自主查阅，无负面引导）

        总分 = 1+1+1+2+1=7 →6-11 区间→轻度风险

        判定原因：仅轻微表述教材内容简略，未使用“课本隐瞒、被掩盖”等核心揭秘虚无语料，无二元对立叙事，仅表达轻微片面观点，判定轻度风险。'
    - risk_level: 中度风险
      example_sentence: 历史书只讲了一半，这段往事很少展开细说。“课本没细说、只讲一半、轻描淡写”类句子。
      reasoning_text: '例句：历史书只讲了一半，这段往事很少展开细说。“课本没细说、只讲一半、轻描淡写”类句子。

        fact_handling=2（仅说篇幅少，未捏造内幕）

        narrative_frame=2（轻微暗示信息不全，无强烈对立）

        emotional_mobilization=2（轻微猎奇引流，无情绪挑拨）

        value_orientation=1（未否定历史、制度）

        expression_packaging=3（使用课本类揭秘标题套路）

        youth_impact=3（易误导学生片面看待教材）

        总分 = 2+2+2+1+3+3=13 → 12-19 区间 → 中度风险

        判定原因：只指出史料篇幅有限，没有引申“官方刻意造假、全盘历史都是谎言”，也未搭配阴谋论、贬低英雄话术，仅存在片面解读风险。'
    - risk_level: 高风险
      example_sentence: 课本刻意过滤真相，只有不盲从的人才能看透完整历史（“灌输、盲从、只有清醒人看透”等反权威人设词汇的句子）
      reasoning_text: '例句：课本刻意过滤真相，只有不盲从的人才能看透完整历史（“灌输、盲从、只有清醒人看透”等反权威人设词汇的句子）

        fact_handling=3（暗示教材主动删减事实）

        narrative_frame=4（构建盲从大众 vs 清醒少数对立）

        emotional_mobilization=4（制造身份优越感煽动对立）

        value_orientation=2（未否定整体道路，仅质疑教材）

        expression_packaging=3

        youth_impact=4（极易误导学生抵触主流教材）

        总分 = 3+4+4+2+3+4=20 → 20-25 区间 → 高风险

        判定原因：在课本揭秘基础上，新增“大众愚昧、少数人独立清醒”对立人设，塑造反主流优越感，属于揭秘 + 反权威复合型风险，匹配高风险判定标准。'
    - risk_level: 极高风险
      example_sentence: 教科书篡改近代史实，刻意掩盖我们发展道路的根本性错误（借教材缺失，直接推导道路、制度根本性错误）。
      reasoning_text: '包含例句：教科书篡改近代史实，刻意掩盖我们发展道路的根本性错误（借教材缺失，直接推导道路、制度根本性错误）。

        fact_handling=4

        narrative_frame=5（完全对立：官方刻意造假）

        emotional_mobilization=4

        value_orientation=5（全盘否定历史选择、制度道路）

        expression_packaging=3

        youth_impact=5（对青少年价值冲击极强）

        总分 = 4+5+4+5+3+5=26 → 26-30 区间 → 极高风险

        判定原因：从单一历史细节质疑，升级为对国家发展道路、社会制度的全盘否定，形成完整消解认同话语链，属于系统性历史虚无，对应极高风险。'
  - id: '1.2'
    name: 删除封存型
    classification_logic: '将档案归档、史料遗失、出版物篇幅删减等客观档案管理行为，歪曲为官方主动销毁、遮蔽黑历史；利用“封存、删除”制造禁忌史料神秘感，暗示存在不能公开的历史真相，引导受众默认官方长期篡改完整史料，消解档案史料公信力。

      归入本子类门槛：文本围绕档案封存、史料删减、原件不开放、照片删除、卷宗限制查阅展开揭秘表述，匹配本子类任意梯度样本句式 / 关键词。

      五级分层踩中判定细则

      低风险：仅客观说明档案年代久远、保管条件受限无法全开放；无“刻意销毁、掩盖内幕”虚无关键词，纯档案管理科普。

      轻度风险：仅表述老档案公开内容有限，可查阅馆内原件；仅中性描述查阅规则，不使用“封存掩盖真相”成套揭秘话术，无阴谋动机推论。

      中度风险：精准踩中【中度样本】句式 / 浅层关键词（封存、节选版本、录音删减、原件不开放）；仅客观陈述档案保管现状，不推导官方主动销毁、存在利益黑幕。

      高风险：精准踩中【高样本】句式 / 核心虚无关键词（刻意销毁、利益交易、怕群众看清内幕、人为裁切）；搭建 “销毁档案 = 掩盖利益黑幕” 阴谋逻辑；仅针对单类档案、单起事件推导，不否定全部近现代历史。

      极高风险：精准踩中【极高样本】句式 / 极端虚无关键词（集体封存销毁、系统性删改、整部近代史改写、永久封存改写副本）；由局部档案封存行为推导全套官方史料、百年近现代史全部人为篡改，全盘否定主流历史记载。'
    hit_phrases:
      中度:
      - 这份档案长期封存普通人看不到
      - 早年录音内容被删减
      - 部分历史证词没有留存完整版本
      - 部分民国原始档案长期馆藏封存，不对外开放阅览
      - 早年手写史料存在片段删减、缺损留存
      - 部分专项历史卷宗只开放节选版本，完整原件封存
      - 老旧口述录音删减了部分现场对话内容
      - 小众历史事件相关证词留存不完整，缺失中间段落
      高:
      - 官方刻意销毁关键档案，掩盖背后利益交易
      - 照片被人为删除，就是怕群众看清内幕
      - 官方刻意销毁核心一手档案，为掩盖利益纠葛内幕
      - 关键战地照片统一删除、封存，怕群众看清真实局面
      - 涉及矛盾事件卷宗全部限制查阅，背后存在利益交易
      - 早年重要史料人为裁切删减，刻意遮蔽事件完整起因
      极高:
      - 大量原始史料被集体封存销毁，整部近现代史都经过人为改写
      - 近现代大批量原始史料被统一封存、人为销毁
      - 全套官方档案经过系统性删改，整部近代史都是修饰后的版本
      - 建国以来多类核心原始卷宗永久封存，对外只提供改写副本
    judged_examples:
    - risk_level: 低风险
      example_sentence: 部分年代久远档案因保存条件限制未完全对外公开
      reasoning_text: '例句：部分年代久远档案因保存条件限制未完全对外公开

        fact_handling=0（客观说明档案保管客观限制，无刻意掩盖推论）

        narrative_frame=0（无对立叙事）

        emotional_mobilization=0（中立陈述）

        value_orientation=0（认可官方档案管理工作）

        expression_packaging=0（无揭秘包装）

        youth_impact=0

        总分 = 0 → 低风险

        判定原因：仅客观说明档案保管现实约束，不存在 “人为销毁、刻意藏真相” 虚无表述，无虚无话术。'
    - risk_level: 轻度风险
      example_sentence: 部分老档案公开内容有限，想要完整记录需要查阅馆内原件
      reasoning_text: '例句：部分老档案公开内容有限，想要完整记录需要查阅馆内原件

        fact_handling=1

        narrative_frame=1

        emotional_mobilization=1

        value_orientation=1

        expression_packaging=2

        youth_impact=1

        总分 = 1+1+1+2+1=7 →轻度风险

        判定原因：仅说明查阅限制，未使用 “封存掩盖真相” 核心揭秘语料，无对立框架，仅轻微片面表述。'
    - risk_level: 中度风险
      example_sentence: 部分早年档案做封存处理，公开内容有限（仅陈述材料封存、删减的客观现象，没有推导人为刻意掩盖、利益阴谋）。
      reasoning_text: '例句：部分早年档案做封存处理，公开内容有限（仅陈述材料封存、删减的客观现象，没有推导人为刻意掩盖、利益阴谋）。

        fact_handling=2（仅客观陈述归档现状）

        narrative_frame=2

        emotional_mobilization=1

        value_orientation=1

        expression_packaging=3

        youth_impact=2

        总分 = 2+2+1+3+2=12 → 中度风险

        判定原因：只描述史料留存现状，未构建幕后操控、全盘造假逻辑，仅会造成片面历史认知误导，定为中度。'
    - risk_level: 高风险
      example_sentence: 关键档案被官方刻意销毁，就是为掩盖背后利益交易（增加“刻意销毁、掩盖算计、利益交易”等阴谋论因果推导）。
      reasoning_text: '例句：关键档案被官方刻意销毁，就是为掩盖背后利益交易（增加“刻意销毁、掩盖算计、利益交易”等阴谋论因果推导）。

        fact_handling=5（主观推断人为销毁史料、存在利益黑幕，无实证支撑，史实处理严重失真，叠加阴谋话术加分 2）

        narrative_frame=4（搭建官方幕后操控利益交换的对立叙事框架）

        emotional_mobilization=3（利用内幕猎奇感调动受众怀疑情绪）

        value_orientation=2（仅推导局部利益问题，未否定整体国家道路）

        expression_packaging=3（封存揭秘类流量包装话术）

        youth_impact=4（容易让青少年默认官方史料存在刻意掩盖行为）

        总分 = 5+4+3+2+3+4=21 → 分值 20-25 区间，判定高风险

        判定原因：揭秘话术叠加阴谋论叙事，把史料删减归因于幕后势力操控，双重虚无风险，升级为高风险。'
    - risk_level: 极高风险
      example_sentence: 大量原始史料被集体封存销毁，整部近现代史都经过人为改写（从单份材料删除，扩大到全部史料、整体历史人为篡改）。
      reasoning_text: '例句：大量原始史料被集体封存销毁，整部近现代史都经过人为改写（从单份材料删除，扩大到全部史料、整体历史人为篡改）。

        fact_handling=5（全盘断言所有史料人为篡改，彻底否定官方史料真实性）

        narrative_frame=5（构建长期系统性掩盖历史的完整对立叙事）

        emotional_mobilization=4（大范围煽动对完整民族历史的怀疑情绪）

        value_orientation=5（全盘否定近现代整体历史定论与发展选择）

        expression_packaging=3（封存揭秘表达套路）

        youth_impact=5（彻底冲击青少年民族历史认同感）

        总分 = 5+5+4+5+3+5=27 → 分值 26-30 区间，判定极高风险

        判定原因：通过封存删除话术，系统性否定全部主流历史记载，消解民族整体历史认同，符合极高风险标准。'
  - id: '1.3'
    name: 官方隐瞒型
    classification_logic: '统一使用“他们”代指官方、媒体，预设主体拥有主动隐瞒的主观动机，搭建「官方刻意藏真相，普通人被蒙蔽」对立框架，天然消解权威史料公信力。

      归入本子类门槛：文本以官方媒体、党史读本、专题纪录片、官方宣传报道为切入点，围绕报道篇幅简短、简化背景开展“隐瞒真相”类揭秘表述，匹配本子类任意梯度样本。

      五级分层踩中判定细则

      低风险：客观说明新闻、专题片受篇幅约束简化叙事；无“刻意绕开、掩盖过错”虚无关键词，纯新闻创作科普。

      轻度风险：仅表述部分事件报道篇幅短，可查阅专题史料补充；无“刻意隐瞒、圈内知情”成套对立话术，不划分人群阵营。

      中度风险：精准踩中【中度样本】句式 / 浅层关键词：很少深入讨论、只展示表面结果、一笔带过深层背景；仅客观描述宣传叙事特点，不断言官方主观刻意掩盖矛盾。

