      归入本子类门槛：文本以人群分层、思考能力划分制造认知优越感，使用“少数人、清醒、盲从大众”话术解读历史叙事，匹配本子类任意梯度样本。

      五级分层踩中判定细则

      低风险：客观提倡多角度查阅史料、多元学习历史；无“清醒、盲从、圈内人”对立分层关键词，正向历史学习引导。

      轻度风险：仅表述大众多阅读基础科普、少查阅拓展史料；不贬低普通受众，无二元对立人群划分话术。

      中度风险：精准踩中【中度样本】句式 / 浅层关键词：看懂细节的人不多、很少深挖、少数人跳出框架；仅客观描述受众阅读习惯，无贬低 “盲从者”、无境外史料对比。

      高风险：精准踩中【高样本】句式 / 核心虚无关键词：盲从、清醒少数、被宣传裹挟、圈内懂内幕；搭建“清醒独立者优于普通大众”对立框架，塑造反权威优越感；仅质疑教材宣传，不引入外国史料全盘否定本国历史。

      极高风险：精准踩中【极高样本】句式 / 极端虚无关键词：国内全部被蒙蔽、国外史料揭露问题、境外著作还原缺陷；绑定中外对比贬损逻辑，认定本土叙事全是修饰，境外史料才是真相，全盘消解民族历史认同。'
