      中度风险：精准踩中【中度样本】句式 / 浅层关键词：时间线出入、数据前后差异、修订读本细节偏差；仅客观陈述多版本史料分歧，不推导整件事存在幕后猫腻、人为修饰。

      高风险：精准踩中【高样本】句式 / 核心虚无关键词：一处对不上就有猫腻、证词矛盾 = 美化包装、人为筛选修改；以单一细节差异以点概面，推导单一事件叙事刻意修饰；不否定全部近现代历史定论。

      极高风险：精准踩中【极高样本】句式 / 极端虚无关键词：多处矛盾、整部叙事不可信、原始版本废弃、定论建立在漏洞之上；依靠多处细微记录误差全盘否定全部主流近现代历史定论，认定整套叙事虚假。'
