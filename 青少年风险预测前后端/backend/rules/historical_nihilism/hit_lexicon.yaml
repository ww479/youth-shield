      中度风险： 精准踩中【中度样本】句式（“不同史料时间、数据记录存在细微出入”“部分档案记载细节略有区别”“新旧档案统计口径不同造成数值差异”）；仅客观指出记录细微偏差，不以矛盾全盘否定史实，无“史料刻意造假”强对立叙事。

      高风险： 精准踩中【高样本】句式/核心虚无关键词（“一处史料对不上，整件历史的正面结论全部站不住脚”“单一文字矛盾就能推翻人物全部功绩”“只要一份小众记录存在偏差，正史定论就完全失效”）；搭建“官方掩盖史料漏洞”强对立叙事，放大细节疑点制造大众怀疑心态；仅否定单一事件，不否定国家整体历史道路。

