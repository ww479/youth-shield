<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风险预警 · 青年心盾</title>
<style>
:root{
  --bg:#EEF2FF;
  --card-bg:rgba(255,255,255,0.92);
  --border:rgba(99,120,210,0.14);
  --primary:#3D6FD4;
  --primary-2:#6B9DFF;
  --accent:#7C3AED;
  --text:#0F172A;
  --text-2:#334155;
  --muted:#64748B;
  --muted-2:#94A3B8;
  --r:20px;
  --r-sm:12px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 16px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 16px 48px rgba(15,23,42,.12),0 4px 14px rgba(15,23,42,.06);
  --lv4:#C0392B; --lv4-bg:rgba(192,57,43,.07); --lv4-border:rgba(192,57,43,.2);
  --lv3:#E67E22; --lv3-bg:rgba(230,126,34,.07); --lv3-border:rgba(230,126,34,.2);
  --lv2:#B8860B; --lv2-bg:rgba(212,172,13,.08); --lv2-border:rgba(212,172,13,.22);
  --lv1:#27AE60;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:
    radial-gradient(ellipse 900px 560px at 12% -4%,rgba(192,57,43,.06) 0%,transparent 58%),
    radial-gradient(ellipse 700px 480px at 88% 105%,rgba(230,126,34,.05) 0%,transparent 58%),
    #EEF2FF;
  color:var(--text);
  min-height:100vh;
}
a{text-decoration:none;color:inherit;}
button,select{font:inherit;cursor:pointer;}

/* ── HEADER ── */
header{
  padding:14px 48px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(200,215,245,.35);
  box-shadow:0 2px 10px rgba(15,23,42,.04);
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#C0392B,#E67E22);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
  box-shadow:0 4px 12px rgba(192,57,43,.3),inset 0 1px 0 rgba(255,255,255,.2);
}
.logo-name{font-size:15px;font-weight:700;color:var(--text);}
.logo-sub{font-size:11px;color:var(--muted-2);margin-top:1px;}
.nav-link{
  padding:8px 16px;border-radius:44px;border:1px solid rgba(61,111,212,.18);
  background:#fff;color:var(--primary);font-size:13px;font-weight:600;
  box-shadow:var(--shadow-sm);transition:all .18s;
}
.nav-link:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.nav-link.active{background:linear-gradient(135deg,#C0392B,#E67E22);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(192,57,43,.3);}
.header-nav{display:flex;align-items:center;gap:8px;}

/* ── LAYOUT ── */
.layout{max-width:1100px;margin:0 auto;padding:24px 40px 64px;}

/* ── PAGE TITLE ── */
.page-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:20px;
  animation:fadeup .4s ease both;
}
.page-title-wrap{display:flex;align-items:center;gap:12px;}
.title-icon{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,rgba(192,57,43,.15),rgba(230,126,34,.08));
  border:1px solid rgba(192,57,43,.2);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.page-title{font-size:22px;font-weight:800;color:var(--text);}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px;}

/* ── KPI STRIP ── */
.kpi-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  margin-bottom:20px;
  animation:fadeup .4s .05s ease both;
}
.kpi-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 16px;
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:space-between;
}
.kpi-label{font-size:12px;color:var(--muted);}
.kpi-value{font-size:22px;font-weight:800;margin-top:3px;line-height:1;}
.kpi-note{font-size:10.5px;color:var(--muted-2);margin-top:4px;}
.kpi-icon{font-size:22px;opacity:.55;}

/* ── ALERT BANNER ── */
.banner-wrap{
  margin-bottom:20px;
  animation:fadeup .45s .08s ease both;
}
.alert-banner{
  position:relative;overflow:hidden;
  border-radius:var(--r);padding:24px 28px;
  border:1px solid;
  box-shadow:var(--shadow-lg);
}
.alert-banner.lv4{
  background:linear-gradient(135deg,rgba(192,57,43,.09),rgba(230,126,34,.05));
  border-color:rgba(192,57,43,.28);
}
.alert-banner.lv3{
  background:linear-gradient(135deg,rgba(230,126,34,.09),rgba(241,196,15,.05));
  border-color:rgba(230,126,34,.28);
}
.alert-banner.lv2{
  background:linear-gradient(135deg,rgba(212,172,13,.09),rgba(241,196,15,.05));
  border-color:rgba(212,172,13,.3);
}
.banner-stripe{position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--r) var(--r) 0 0;}
.lv4 .banner-stripe{background:linear-gradient(90deg,#C0392B,#E74C3C);}
.lv3 .banner-stripe{background:linear-gradient(90deg,#E67E22,#F39C12);}
.lv2 .banner-stripe{background:linear-gradient(90deg,#D4AC0D,#F1C40F);}

.banner-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pulse-dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  animation:pulse-ring 1.8s ease-in-out infinite;
}
.lv4 .pulse-dot{background:#C0392B;box-shadow:0 0 0 0 rgba(192,57,43,.5);}
.lv3 .pulse-dot{background:#E67E22;box-shadow:0 0 0 0 rgba(230,126,34,.5);}
.lv2 .pulse-dot{background:#D4AC0D;box-shadow:0 0 0 0 rgba(212,172,13,.5);}
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 currentColor;opacity:1;}
  70%{box-shadow:0 0 0 10px transparent;opacity:.7;}
  100%{box-shadow:0 0 0 0 transparent;opacity:1;}
}
.lv4 .pulse-dot{box-shadow:0 0 0 0 rgba(192,57,43,.6);}
.lv3 .pulse-dot{box-shadow:0 0 0 0 rgba(230,126,34,.6);}
.lv2 .pulse-dot{box-shadow:0 0 0 0 rgba(212,172,13,.6);}

.banner-label{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);}
.banner-badge{
  font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;
}
.lv4 .banner-badge{background:rgba(192,57,43,.12);color:#C0392B;border:1px solid rgba(192,57,43,.25);}
.lv3 .banner-badge{background:rgba(230,126,34,.12);color:#C97D1D;border:1px solid rgba(230,126,34,.25);}
.lv2 .banner-badge{background:rgba(212,172,13,.12);color:#8E6D05;border:1px solid rgba(212,172,13,.3);}

.banner-body{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;}
.banner-title{
  font-size:18px;font-weight:800;line-height:1.4;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.banner-meta{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;
}
.banner-pill{
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  background:rgba(0,0,0,.05);color:var(--text-2);
}
.banner-score-wrap{text-align:right;min-width:80px;}
.banner-score{font-size:38px;font-weight:900;line-height:1;}
.lv4 .banner-score{color:#C0392B;}
.lv3 .banner-score{color:#C97D1D;}
.lv2 .banner-score{color:#8E6D05;}
.banner-score-label{font-size:11px;color:var(--muted-2);margin-top:4px;}
.banner-bar-wrap{margin-top:14px;display:flex;align-items:center;gap:10px;}
.banner-bar{flex:1;height:6px;border-radius:4px;background:rgba(0,0,0,.07);overflow:hidden;}
.banner-fill{height:100%;border-radius:4px;transition:width .7s ease;}
.lv4 .banner-fill{background:linear-gradient(90deg,#E74C3C,#C0392B);}
.lv3 .banner-fill{background:linear-gradient(90deg,#F39C12,#E67E22);}
.lv2 .banner-fill{background:linear-gradient(90deg,#F1C40F,#D4AC0D);}
.banner-bar-label{font-size:11px;color:var(--muted-2);white-space:nowrap;}
.banner-cta{
  display:inline-block;margin-top:14px;
  padding:9px 22px;border-radius:44px;border:none;
  font-size:13px;font-weight:700;color:#fff;
  transition:transform .18s,box-shadow .18s;
}
.lv4 .banner-cta{background:linear-gradient(135deg,#C0392B,#E74C3C);box-shadow:0 4px 14px rgba(192,57,43,.35);}
.lv3 .banner-cta{background:linear-gradient(135deg,#E67E22,#F39C12);box-shadow:0 4px 14px rgba(230,126,34,.35);}
.lv2 .banner-cta{background:linear-gradient(135deg,#D4AC0D,#F1C40F);box-shadow:0 4px 14px rgba(212,172,13,.3);color:#5a4200;}
.banner-cta:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(0,0,0,.18);}

/* ── FILTER BAR ── */
.filter-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:16px;
  animation:fadeup .4s .12s ease both;
}
.filter-select{
  height:34px;border:1px solid rgba(99,120,210,.18);
  border-radius:44px;padding:0 14px;
  background:#fff;color:var(--text);font-size:13px;
  box-shadow:var(--shadow-sm);
}
.filter-select:focus{outline:none;border-color:var(--primary);}
.filter-count{
  margin-left:auto;font-size:13px;color:var(--muted);
}
.btn-refresh{
  padding:8px 18px;border-radius:44px;border:none;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 3px 10px rgba(61,111,212,.28);
  transition:all .18s;display:flex;align-items:center;gap:6px;
}
.btn-refresh:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(61,111,212,.35);}

/* ── SKELETON ── */
.skeleton{
  background:linear-gradient(90deg,#e8edf5 25%,#f5f8ff 50%,#e8edf5 75%);
  background-size:800px 100%;
  animation:shimmer 1.4s infinite linear;
  border-radius:var(--r-sm);
}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
.sk-banner{height:176px;border-radius:var(--r);margin-bottom:20px;}
.sk-item{height:88px;margin-bottom:10px;}

/* ── ALERT LIST ── */
.alert-list{display:grid;gap:10px;}
.alert-item{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--r-sm);
  display:grid;grid-template-columns:5px 1fr;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  animation:card-in .35s ease both;
}
.alert-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgba(99,120,210,.25);}
.item-band{width:5px;}
.item-band.lv4{background:#C0392B;}
.item-band.lv3{background:#E67E22;}
.item-band.lv2{background:#D4AC0D;}
.item-body{padding:12px 16px;display:flex;flex-direction:column;gap:7px;min-width:0;}
.item-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.risk-badge{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;
}
.rb-lv4{background:rgba(192,57,43,.1);color:#C0392B;border:1px solid rgba(192,57,43,.2);}
.rb-lv3{background:rgba(230,126,34,.1);color:#C97D1D;border:1px solid rgba(230,126,34,.2);}
.rb-lv2{background:rgba(212,172,13,.1);color:#8E6D05;border:1px solid rgba(212,172,13,.25);}
.plat-badge{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;
  background:rgba(61,111,212,.08);color:var(--primary);
  border:1px solid rgba(61,111,212,.15);
}
.item-score{
  margin-left:auto;font-size:17px;font-weight:800;line-height:1;
}
.sc-lv4{color:#C0392B;} .sc-lv3{color:#C97D1D;} .sc-lv2{color:#8E6D05;}
.item-title{
  font-size:14px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-meta{
  font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-cta{
  font-size:12px;font-weight:600;color:var(--primary);
  white-space:nowrap;margin-left:auto;
  align-self:flex-end;padding:4px 0;
}

/* ── LOAD MORE ── */
.load-more-wrap{text-align:center;margin-top:20px;}
.btn-more{
  padding:10px 32px;border-radius:44px;border:1px solid rgba(61,111,212,.2);
  background:#fff;color:var(--primary);font-size:13px;font-weight:600;
  box-shadow:var(--shadow-sm);transition:all .18s;
}
.btn-more:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-more[hidden]{display:none;}

/* ── EMPTY / ERROR ── */
.empty,.error-msg{
  text-align:center;padding:48px 24px;
  color:var(--muted);font-size:14px;
  border:1px dashed rgba(99,120,210,.2);
  border-radius:var(--r-sm);background:#fff;
}
.error-msg{color:#C0392B;}

/* ── ANIMATIONS ── */
@keyframes fadeup{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
@keyframes card-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  header{padding:14px 20px;}
  .layout{padding:18px 20px 48px;}
  .kpi-strip{grid-template-columns:repeat(2,1fr);}
  .banner-body{grid-template-columns:1fr;}
  .banner-score-wrap{display:flex;align-items:baseline;gap:8px;text-align:left;}
}
@media(max-width:600px){
  .kpi-strip{grid-template-columns:1fr;}
  .header-nav .nav-link:not(.active){display:none;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚠</div>
    <div>
      <div class="logo-name">青年心盾 · 风险预警</div>
      <div class="logo-sub">主动扫描 · 中风险及以上内容预警</div>
    </div>
  </div>
  <div class="header-nav">
    <a class="nav-link" href="home.html">首页</a>
    <a class="nav-link" href="trends.html">态势研判</a>
    <a class="nav-link" href="account.html">账号画像</a>
    <a class="nav-link" href="index.html">内容分析</a>
    <a class="nav-link active" href="alert.html">风险预警</a>
  </div>
</header>

<div class="layout">

  <!-- 页面标题 -->
  <div class="page-head">
    <div class="page-title-wrap">
      <div class="title-icon">🔍</div>
      <div>
        <div class="page-title">风险预警扫描</div>
        <div class="page-sub">自动扫描语料库，实时预警中风险（L2）及以上内容，点击任意条目查看完整分析</div>
      </div>
    </div>
  </div>

  <!-- KPI 统计条 -->
  <div class="kpi-strip" id="kpi-strip">
    <div class="kpi-card"><div><div class="kpi-label">预警内容总量</div><div class="kpi-value" id="kpi-total">--</div><div class="kpi-note">L2 及以上</div></div><div class="kpi-icon">⚠</div></div>
    <div class="kpi-card"><div><div class="kpi-label">极高/高风险</div><div class="kpi-value" id="kpi-high">--</div><div class="kpi-note">L3 / L4</div></div><div class="kpi-icon">🔴</div></div>
    <div class="kpi-card"><div><div class="kpi-label">平均风险分</div><div class="kpi-value" id="kpi-avg">--</div><div class="kpi-note">当前筛选范围</div></div><div class="kpi-icon">📊</div></div>
    <div class="kpi-card"><div><div class="kpi-label">覆盖平台</div><div class="kpi-value" id="kpi-plat">--</div><div class="kpi-note">个</div></div><div class="kpi-icon">📡</div></div>
  </div>

  <!-- 骨架屏 -->
  <div id="skeleton">
    <div class="skeleton sk-banner"></div>
    <div class="skeleton sk-item"></div>
    <div class="skeleton sk-item"></div>
    <div class="skeleton sk-item"></div>
  </div>

  <!-- 首个预警横幅 -->
  <div class="banner-wrap" id="banner-wrap" hidden></div>

  <!-- 过滤栏 -->
  <div class="filter-bar" id="filter-bar" hidden>
    <select class="filter-select" id="sel-platform">
      <option value="">全部平台</option>
      <option>微博</option><option>抖音</option><option>小红书</option><option>百度</option>
    </select>
    <select class="filter-select" id="sel-domain">
      <option value="">全部风险域</option>
      <option>制度认同风险</option><option>历史认知风险</option>
      <option>心理韧性风险</option><option>认知闭合风险</option><option>网络素养风险</option>
    </select>
    <select class="filter-select" id="sel-level">
      <option value="">全部等级（L2+）</option>
      <option value="L4">极高风险（L4）</option>
      <option value="L3">高风险（L3）</option>
      <option value="L2">中风险（L2）</option>
    </select>
    <button class="btn-refresh" id="btn-refresh">↺ 重新扫描</button>
    <span class="filter-count" id="filter-count"></span>
  </div>

  <!-- 预警列表 -->
  <div class="alert-list" id="alert-list" hidden></div>

  <!-- 加载更多 -->
  <div class="load-more-wrap" id="load-more-wrap" hidden>
    <button class="btn-more" id="btn-more" type="button">加载更多预警内容</button>
  </div>

</div>

<script>
const API = 'http://localhost:8000';
const PAGE_SIZE = 30;

const LV_MAP = {
  '极高风险':'lv4','高风险':'lv3','中度风险':'lv2','轻度风险':'lv1','低风险':'lv0',
  'L4':'lv4','L3':'lv3','L2':'lv2','L1':'lv1','L0':'lv0',
};
const LV_LABEL = {lv4:'极高风险',lv3:'高风险',lv2:'中度风险',lv1:'轻度风险',lv0:'低风险'};
const LV_RB = {lv4:'rb-lv4',lv3:'rb-lv3',lv2:'rb-lv2'};
const LV_SC = {lv4:'sc-lv4',lv3:'sc-lv3',lv2:'sc-lv2'};

let allItems = [];
let displayedCount = 0;
let totalCount = 0;

function lvClass(raw){ return LV_MAP[String(raw||'')] || 'lv2'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(n){ const v=Number(n||0); return v>=10000?(v/10000).toFixed(1)+'万':String(v); }
function score5(s){ return Math.max(0,Math.min(5,Number(s||0))).toFixed(2); }

function buildParams(offset=0){
  const p = new URLSearchParams({limit:PAGE_SIZE, offset});
  const pl = document.getElementById('sel-platform').value;
  const dom = document.getElementById('sel-domain').value;
  const lv = document.getElementById('sel-level').value;
  if(pl) p.set('platform', pl);
  if(dom) p.set('domain', dom);
  if(lv) p.set('risk_level', lv);
  return p;
}

function showSkeleton(){ document.getElementById('skeleton').hidden = false; }
function hideSkeleton(){ document.getElementById('skeleton').hidden = true; }

function renderKpis(kpi, alertTotal){
  document.getElementById('kpi-total').textContent = fmt(alertTotal);
  document.getElementById('kpi-high').textContent = fmt(kpi.high_count);
  document.getElementById('kpi-avg').textContent = Number(kpi.avg_score||0).toFixed(2);
  document.getElementById('kpi-plat').textContent = kpi.platform_count || '--';
}

function renderBanner(item){
  const wrap = document.getElementById('banner-wrap');
  if(!item){ wrap.hidden = true; return; }
  const lv = lvClass(item.lv);
  const label = LV_LABEL[lv] || item.lv || '中度风险';
  const pct = Math.round((Number(item.score||0)/5)*100);
  const analyzeUrl = item.url ? `index.html?url=${encodeURIComponent(item.url)}` : '#';
  const interaction = (Number(item.like_count||0)+Number(item.comment_count||0));

  wrap.innerHTML = `
    <div class="alert-banner ${lv}">
      <div class="banner-stripe"></div>
      <div class="banner-top">
        <div class="pulse-dot"></div>
        <span class="banner-label">首个预警 · 最高风险内容</span>
        <span class="banner-badge">${esc(label)}</span>
      </div>
      <div class="banner-body">
        <div>
          <div class="banner-title">${esc(item.title||'未命名内容')}</div>
          <div class="banner-meta">
            ${item.platform?`<span class="banner-pill">${esc(item.platform)}</span>`:''}
            ${item.domain?`<span class="banner-pill">${esc(item.domain)}</span>`:''}
            ${item.rtype?`<span class="banner-pill">${esc(item.rtype)}</span>`:''}
            ${item.pub_date&&item.pub_date!='0000-00-00'?`<span class="banner-pill">${esc(item.pub_date)}</span>`:''}
            ${interaction?`<span class="banner-pill">互动 ${fmt(interaction)}</span>`:''}
          </div>
          <div class="banner-bar-wrap">
            <div class="banner-bar"><div class="banner-fill" style="width:0%" id="banner-fill"></div></div>
            <span class="banner-bar-label">风险得分 ${pct}%</span>
          </div>
          ${item.url?`<a class="banner-cta" href="${esc(analyzeUrl)}">查看完整分析 →</a>`:''}
        </div>
        <div class="banner-score-wrap">
          <div class="banner-score">${score5(item.score)}</div>
          <div class="banner-score-label">/ 5.0</div>
        </div>
      </div>
    </div>
  `;
  wrap.hidden = false;
  // 得分条动画
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const fill = document.getElementById('banner-fill');
    if(fill) fill.style.width = `${pct}%`;
  }));
}

function renderList(items, append=false){
  const list = document.getElementById('alert-list');
  if(!append) list.innerHTML = '';
  if(!items.length && !append){
    list.innerHTML = '<div class="empty">当前筛选条件下未发现风险内容。</div>';
    list.hidden = false;
    return;
  }
  const startIdx = append ? displayedCount - items.length : 0;
  items.forEach((item, i)=>{
    const lv = lvClass(item.lv);
    const label = LV_LABEL[lv] || item.lv || '中度风险';
    const analyzeUrl = item.url ? `index.html?url=${encodeURIComponent(item.url)}` : '#';
    const interaction = Number(item.like_count||0)+Number(item.comment_count||0);
    const metaParts = [
      item.domain,
      item.rtype,
      item.pub_date && item.pub_date !== '0000-00-00' ? item.pub_date : null,
      interaction ? `互动 ${fmt(interaction)}` : null,
    ].filter(Boolean);
    const delay = ((startIdx+i)*0.04).toFixed(2);
    const el = document.createElement('article');
    el.className = 'alert-item';
    el.style.animationDelay = `${delay}s`;
    el.innerHTML = `
      <div class="item-band ${lv}"></div>
      <div class="item-body">
        <div class="item-top">
          <span class="risk-badge ${LV_RB[lv]||'rb-lv2'}">${esc(label)}</span>
          ${item.platform?`<span class="plat-badge">${esc(item.platform)}</span>`:''}
          <span class="item-score ${LV_SC[lv]||'sc-lv2'}">${score5(item.score)}</span>
          ${item.url?`<span class="item-cta">查看分析 →</span>`:''}
        </div>
        <div class="item-title" title="${esc(item.title||'')}">${esc(item.title||'未命名内容')}</div>
        <div class="item-meta">${esc(metaParts.join(' · '))}</div>
      </div>
    `;
    if(item.url){
      el.addEventListener('click', ()=>{ window.open(analyzeUrl, '_blank'); });
    }
    list.appendChild(el);
  });
  list.hidden = false;
}

function updateLoadMore(){
  const wrap = document.getElementById('load-more-wrap');
  wrap.hidden = displayedCount >= totalCount;
}

async function loadAlerts(append=false){
  if(!append){
    showSkeleton();
    document.getElementById('banner-wrap').hidden = true;
    document.getElementById('filter-bar').hidden = true;
    document.getElementById('alert-list').hidden = true;
    document.getElementById('load-more-wrap').hidden = true;
    allItems = [];
    displayedCount = 0;
    totalCount = 0;
  }

  const offset = append ? displayedCount : 0;
  const params = buildParams(offset);

  try{
    const [alertRes, matrixRes] = await Promise.all([
      fetch(`${API}/dashboard/alerts?${params}`, {signal:AbortSignal.timeout(15000)}).then(r=>r.json()),
      fetch(`${API}/dashboard/matrix`, {signal:AbortSignal.timeout(15000)}).then(r=>r.json()),
    ]);

    const items = alertRes.alerts || [];
    totalCount = Number(alertRes.total || items.length);
    if(!append) allItems = items;
    else allItems = allItems.concat(items);
    displayedCount = allItems.length;

    hideSkeleton();
    renderKpis(matrixRes.kpi || {}, totalCount);
    document.getElementById('filter-count').textContent = `共 ${totalCount.toLocaleString('zh-CN')} 条预警`;

    if(!append) renderBanner(items[0]);
    renderList(items, append);
    updateLoadMore();
    document.getElementById('filter-bar').hidden = false;

  }catch(err){
    hideSkeleton();
    document.getElementById('alert-list').innerHTML = `<div class="error-msg">预警数据加载失败：${esc(String(err?.message||err))}，请确认后端服务已启动。</div>`;
    document.getElementById('alert-list').hidden = false;
    document.getElementById('filter-bar').hidden = false;
  }
}

// 事件绑定
document.getElementById('btn-refresh').addEventListener('click', ()=>loadAlerts(false));
document.getElementById('sel-platform').addEventListener('change', ()=>loadAlerts(false));
document.getElementById('sel-domain').addEventListener('change', ()=>loadAlerts(false));
document.getElementById('sel-level').addEventListener('change', ()=>loadAlerts(false));
document.getElementById('btn-more').addEventListener('click', ()=>loadAlerts(true));

// 初始加载
loadAlerts();
</script>
</body>
</html>
