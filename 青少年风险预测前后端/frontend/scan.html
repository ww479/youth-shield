<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面扫描 · 青年心盾</title>
<style>
:root{
  --bg:#EEF2FF;--card-bg:rgba(255,255,255,0.92);--border:rgba(99,120,210,0.14);
  --primary:#3D6FD4;--accent:#7C3AED;--text:#0F172A;--text-2:#334155;
  --muted:#64748B;--muted-2:#94A3B8;
  --r:16px;--r-sm:10px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.05);
  --shadow-md:0 4px 16px rgba(15,23,42,.08);
  --shadow-lg:0 16px 48px rgba(15,23,42,.12);
  --lv4:#C0392B;--lv3:#E67E22;--lv2:#B8860B;--lv1:#27AE60;--lv0:#94A3B8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:
    radial-gradient(ellipse 900px 560px at 12% -4%,rgba(61,111,212,.1) 0%,transparent 58%),
    radial-gradient(ellipse 700px 480px at 88% 105%,rgba(124,58,237,.08) 0%,transparent 58%),
    #EEF2FF;
  color:var(--text);min-height:100vh;
}
a{text-decoration:none;color:inherit;}
button,input{font:inherit;}

/* HEADER */
header{
  padding:14px 48px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.78);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(200,215,245,.35);
  box-shadow:0 2px 10px rgba(15,23,42,.04);
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:12px;}
.logo-icon{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#3D6FD4,#7C3AED);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;
  box-shadow:0 4px 12px rgba(61,111,212,.32);
}
.logo-name{font-size:15px;font-weight:700;}
.logo-sub{font-size:11px;color:var(--muted-2);margin-top:1px;}
.nav-link{
  padding:8px 16px;border-radius:44px;border:1px solid rgba(61,111,212,.18);
  background:#fff;color:var(--primary);font-size:13px;font-weight:600;
  box-shadow:var(--shadow-sm);transition:all .18s;
}
.nav-link:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
.header-nav{display:flex;gap:8px;}

/* LAYOUT */
.layout{max-width:900px;margin:0 auto;padding:32px 40px 64px;}

/* 页面标题 */
.page-head{text-align:center;margin-bottom:28px;animation:fadeup .4s ease both;}
.page-title{font-size:24px;font-weight:800;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--muted);line-height:1.6;}

/* 搜索框 */
.scan-wrap{
  display:flex;align-items:center;gap:0;
  background:#fff;border:1.5px solid rgba(61,111,212,.2);border-radius:50px;
  padding:7px 7px 7px 20px;
  box-shadow:0 4px 24px rgba(61,111,212,.1);
  margin-bottom:12px;
  transition:border-color .25s,box-shadow .25s;
  animation:fadeup .4s .05s ease both;
}
.scan-wrap:focus-within{
  border-color:var(--primary);
  box-shadow:0 4px 32px rgba(61,111,212,.18);
}
.scan-input{
  flex:1;border:none;outline:none;background:none;
  font-size:14px;color:var(--text);
}
.scan-input::placeholder{color:#B0C2D8;}
.scan-limit{
  font-size:12px;padding:7px 12px;border-radius:20px;
  background:rgba(61,111,212,.06);border:1px solid rgba(61,111,212,.14);
  color:var(--primary);outline:none;cursor:pointer;margin-right:6px;font-weight:500;
}
.btn-scan{
  padding:11px 24px;border-radius:44px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#3D6FD4,#7C3AED);color:#fff;
  font-size:14px;font-weight:600;
  box-shadow:0 4px 16px rgba(61,111,212,.35);
  transition:transform .18s,box-shadow .18s;white-space:nowrap;
}
.btn-scan:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(61,111,212,.4);}
.btn-scan:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.preset-chips{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;
  animation:fadeup .4s .1s ease both;
}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;
  color:var(--primary);background:rgba(61,111,212,.06);
  border:1px solid rgba(61,111,212,.15);transition:all .18s;
}
.chip:hover{background:rgba(61,111,212,.12);border-color:rgba(61,111,212,.3);}
.chip-type{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;}
.ct-list{background:rgba(61,111,212,.1);color:var(--primary);}
.ct-art{background:rgba(124,58,237,.1);color:var(--accent);}

/* 状态栏 */
.status-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:var(--r-sm);
  background:var(--card-bg);border:1px solid var(--border);
  margin-bottom:16px;font-size:13px;color:var(--muted);
  box-shadow:var(--shadow-sm);
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex-shrink:0;}
.status-dot.scanning{background:#3D6FD4;animation:dot-pulse .8s ease-in-out infinite;}
.status-dot.done-ok{background:#27AE60;}
.status-dot.done-warn{background:#C0392B;}
@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.75);}}
.status-text{flex:1;}
.status-count{font-weight:700;color:var(--text);}

/* 预警横幅 */
#scan-alert{
  display:none;border-radius:var(--r);padding:16px 20px;
  margin-bottom:16px;border:1px solid;position:relative;overflow:hidden;
}
#scan-alert.show{display:block;animation:fadeup .45s ease both;}
#scan-alert.lv4{background:linear-gradient(135deg,rgba(192,57,43,.1),rgba(220,60,40,.06));border-color:rgba(192,57,43,.3);}
#scan-alert.lv3{background:linear-gradient(135deg,rgba(230,126,34,.1),rgba(220,120,15,.06));border-color:rgba(230,126,34,.3);}
#scan-alert.lv2{background:linear-gradient(135deg,rgba(184,134,11,.1),rgba(212,172,13,.06));border-color:rgba(184,134,11,.3);}
.sa-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
.lv4 .sa-stripe{background:linear-gradient(90deg,#C0392B,#E74C3C);}
.lv3 .sa-stripe{background:linear-gradient(90deg,#E67E22,#F39C12);}
.lv2 .sa-stripe{background:linear-gradient(90deg,#B8860B,#D4AC0D);}
.sa-body{display:flex;align-items:center;gap:12px;margin-top:4px;}
.sa-pulse{
  width:11px;height:11px;border-radius:50%;background:#fff;flex-shrink:0;
  animation:sa-pulse 1.5s ease-in-out infinite;
}
.lv4 .sa-pulse{background:var(--lv4);}
.lv3 .sa-pulse{background:var(--lv3);}
.lv2 .sa-pulse{background:var(--lv2);}
@keyframes sa-pulse{0%,100%{box-shadow:0 0 0 0 currentColor;opacity:1;}50%{box-shadow:0 0 0 7px transparent;opacity:.7;}}
.sa-content{flex:1;min-width:0;}
.sa-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.sa-title{font-size:14px;font-weight:800;color:var(--text);}
.sa-detail{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sa-score{font-size:28px;font-weight:900;flex-shrink:0;line-height:1;}
.lv4 .sa-score{color:var(--lv4);}
.lv3 .sa-score{color:var(--lv3);}
.lv2 .sa-score{color:var(--lv2);}
.sa-close{
  width:26px;height:26px;border-radius:8px;border:1px solid var(--border);
  background:#fff;cursor:pointer;font-size:13px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .18s;
}
.sa-close:hover{background:var(--primary);color:#fff;border-color:var(--primary);}

/* 文章列表 */
.article-list{display:grid;gap:10px;}
.article-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:14px 16px;
  display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;
  box-shadow:var(--shadow-sm);cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  animation:card-in .4s ease both;
  text-decoration:none;color:inherit;
}
.article-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgba(99,120,210,.25);}
.ac-band{border-radius:4px;height:100%;min-height:44px;}
.ac-body{min-width:0;}
.ac-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.ac-badge{
  font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;
  border:1px solid;
}
.b-lv4{background:rgba(192,57,43,.08);color:var(--lv4);border-color:rgba(192,57,43,.2);}
.b-lv3{background:rgba(230,126,34,.08);color:var(--lv3);border-color:rgba(230,126,34,.2);}
.b-lv2{background:rgba(184,134,11,.08);color:var(--lv2);border-color:rgba(184,134,11,.2);}
.b-lv1{background:rgba(39,174,96,.08);color:var(--lv1);border-color:rgba(39,174,96,.2);}
.b-lv0{background:rgba(148,163,184,.08);color:var(--lv0);border-color:rgba(148,163,184,.2);}
.ac-domain{font-size:11px;color:var(--muted);}
.ac-time{font-size:11px;color:var(--muted-2);}
.ac-score{font-size:20px;font-weight:900;text-align:right;flex-shrink:0;line-height:1;}
.ac-score-sub{font-size:10px;color:var(--muted-2);text-align:center;margin-top:2px;}

/* 扫描中动画卡片 */
.scanning-card{
  background:var(--card-bg);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);color:var(--muted);font-size:13px;
  animation:card-in .3s ease both;
}
.spin{width:16px;height:16px;border:2px solid rgba(61,111,212,.2);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 空/错误 */
.empty,.error-msg{
  text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;
  border:1px dashed rgba(99,120,210,.2);border-radius:var(--r-sm);background:#fff;
}
.error-msg{color:var(--lv4);}

/* 动画 */
@keyframes fadeup{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
@keyframes card-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:640px){
  header{padding:14px 16px;}
  .layout{padding:20px 16px 48px;}
  .header-nav .nav-link:not(:last-child){display:none;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <div>
      <div class="logo-name">青年心盾 · 页面扫描</div>
      <div class="logo-sub">逐条扫描页面文章，发现风险立即预警</div>
    </div>
  </div>
  <div class="header-nav">
    <a class="nav-link" href="home.html">首页</a>
    <a class="nav-link" href="alert.html">预警中心</a>
    <a class="nav-link" href="index.html">内容分析</a>
  </div>
</header>

<div class="layout">

  <!-- 页面标题 -->
  <div class="page-head">
    <div class="page-title">页面风险扫描</div>
    <div class="page-sub">输入中青网（或其他）页面地址，系统自动提取所有文章，逐条扫描内容风险，<br>发现第一条中风险及以上内容立即预警。</div>
  </div>

  <!-- 输入框 -->
  <div class="scan-wrap">
    <input class="scan-input" id="urlInput" type="text"
      placeholder="粘贴中青网列表页或文章页 URL，如 https://news.youth.cn/gj/" />
    <select class="scan-limit" id="limitSel">
      <option value="8">扫 8 篇</option>
      <option value="15" selected>扫 15 篇</option>
      <option value="30">扫 30 篇</option>
    </select>
    <button class="btn-scan" id="btnScan" onclick="startScan()">开始扫描</button>
  </div>

  <!-- 预设地址快速触发 -->
  <div class="preset-chips">
    <span style="font-size:12px;color:var(--muted-2);align-self:center;">快速测试：</span>
    <span class="chip" onclick="usePreset('https://news.youth.cn/gj/')">
      <span class="chip-type ct-list">列表</span>国际频道
    </span>
    <span class="chip" onclick="usePreset('https://news.youth.cn/gn/')">
      <span class="chip-type ct-list">列表</span>国内频道
    </span>
    <span class="chip" onclick="usePreset('https://news.youth.cn/gj/202606/t20260629_16736753.htm')">
      <span class="chip-type ct-art">文章</span>委内瑞拉地震报道
    </span>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar" style="display:none">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">准备就绪</div>
    <div class="status-count" id="statusCount"></div>
  </div>

  <!-- 预警横幅 -->
  <div id="scan-alert">
    <div class="sa-stripe"></div>
    <div class="sa-body">
      <div class="sa-pulse"></div>
      <div class="sa-content">
        <div class="sa-eyebrow">风险预警 · Risk Alert</div>
        <div class="sa-title" id="sa-title">—</div>
        <div class="sa-detail" id="sa-detail">—</div>
      </div>
      <div>
        <div class="sa-score" id="sa-score">—</div>
        <div style="font-size:10px;color:var(--muted-2);text-align:center;">/ 5.0</div>
      </div>
      <button class="sa-close" onclick="closeAlert()">✕</button>
    </div>
  </div>

  <!-- 文章列表 -->
  <div class="article-list" id="articleList"></div>

</div>

<script>
const API = 'http://localhost:8000';
const LV_ORDER = {L4:4,L3:3,L2:2,L1:1,L0:0};
const LV_LABEL = {L4:'极高风险',L3:'高风险',L2:'中度风险',L1:'轻度风险',L0:'低风险'};
const LV_COLOR = {L4:'#C0392B',L3:'#E67E22',L2:'#B8860B',L1:'#27AE60',L0:'#94A3B8'};
const LV_BAND  = {L4:'#C0392B',L3:'#E67E22',L2:'#D4AC0D',L1:'#27AE60',L0:'#E2E8F0'};
let alertShown = false;

function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function usePreset(url){
  document.getElementById('urlInput').value = url;
  document.getElementById('urlInput').focus();
}

function setStatus(type, text, count=''){
  const bar  = document.getElementById('statusBar');
  const dot  = document.getElementById('statusDot');
  const txt  = document.getElementById('statusText');
  const cnt  = document.getElementById('statusCount');
  bar.style.display = 'flex';
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
  cnt.textContent = count;
}

function closeAlert(){
  document.getElementById('scan-alert').className = '';
  document.getElementById('scan-alert').style.display = 'none';
}

function showAlert(article){
  const lv = article.risk_level;
  const el = document.getElementById('scan-alert');
  el.className = `show ${lv.toLowerCase()}`;
  el.style.display = 'block';
  document.getElementById('sa-title').textContent =
    `发现${LV_LABEL[lv]}内容 — ${lv==='L4'?'请立即人工复核':lv==='L3'?'建议人工复核':'建议关注'}`;
  document.getElementById('sa-detail').textContent =
    `${article.title}${article.domain ? '　·　' + article.domain : ''}`;
  document.getElementById('sa-score').textContent =
    Number(article.score||0).toFixed(2);
  document.getElementById('sa-score').style.color = LV_COLOR[lv]||'#94A3B8';
}

function renderArticleCard(article, index){
  const lv   = article.risk_level || 'L0';
  const band = LV_BAND[lv] || '#E2E8F0';
  const delay = (index * 0.05).toFixed(2);

  const card = document.createElement('a');
  card.className = 'article-card';
  card.href = article.url || '#';
  card.target = '_blank';
  card.rel = 'noopener';
  card.style.animationDelay = `${delay}s`;

  const tags = (article.matched_tags || []).slice(0,2).filter(Boolean);
  const domainHtml = article.domain
    ? `<span class="ac-domain">${esc(article.domain)}</span>` : '';
  const timeHtml = article.pub_time
    ? `<span class="ac-time">${esc(article.pub_time)}</span>` : '';
  const tagsHtml = tags.length
    ? `<span class="ac-domain" style="color:#9B2335">命中：${esc(tags.join('、'))}</span>` : '';

  card.innerHTML = `
    <div class="ac-band" style="background:${band}"></div>
    <div class="ac-body">
      <div class="ac-title">${esc(article.title || '未命名文章')}</div>
      <div class="ac-meta">
        <span class="ac-badge b-${lv.toLowerCase()}">${LV_LABEL[lv]||lv}</span>
        ${domainHtml}${timeHtml}${tagsHtml}
      </div>
    </div>
    <div>
      <div class="ac-score" style="color:${LV_COLOR[lv]}">${Number(article.score||0).toFixed(1)}</div>
      <div class="ac-score-sub">/ 5.0</div>
    </div>
  `;
  return card;
}

async function startScan(){
  const url   = document.getElementById('urlInput').value.trim();
  const limit = document.getElementById('limitSel').value;
  if(!url){ alert('请输入页面地址'); return; }
  if(!url.startsWith('http')){ alert('请输入完整地址（以 http 开头）'); return; }

  // 重置
  alertShown = false;
  closeAlert();
  document.getElementById('articleList').innerHTML = '';
  document.getElementById('btnScan').disabled = true;
  document.getElementById('btnScan').textContent = '扫描中…';
  setStatus('scanning', '正在连接并解析页面…');

  try{
    const res  = await fetch(`${API}/dashboard/scan_page?url=${encodeURIComponent(url)}&limit=${limit}`,
      {signal: AbortSignal.timeout(90000)});
    if(!res.ok){ const t=await res.text(); throw new Error(t); }
    const data = await res.json();

    const articles = data.articles || [];
    const total    = articles.length;
    const list     = document.getElementById('articleList');

    if(!total){
      list.innerHTML = '<div class="empty">未从该页面提取到文章，请确认 URL 是否正确。</div>';
      setStatus('done-ok', '扫描完成，未提取到文章');
      return;
    }

    setStatus('scanning', `正在逐条扫描…`, `0 / ${total}`);

    // 逐张出现（每 600ms 一张）
    const DELAY = 600;
    let count = 0;
    for(let i = 0; i < articles.length; i++){
      await new Promise(resolve => setTimeout(resolve, i === 0 ? 0 : DELAY));
      const art  = articles[i];
      const card = renderArticleCard(art, i);
      list.appendChild(card);
      count++;
      setStatus('scanning', `正在逐条扫描…`, `${count} / ${total}`);

      // 发现第一个 L2+ 立即预警
      if(!alertShown && (LV_ORDER[art.risk_level]||0) >= 2){
        alertShown = true;
        await new Promise(resolve => setTimeout(resolve, 180));
        showAlert(art);
      }
    }

    // 完成
    const highCount = articles.filter(a=>(LV_ORDER[a.risk_level]||0)>=2).length;
    if(highCount > 0){
      setStatus('done-warn', `扫描完成，发现 ${highCount} 篇风险内容`, `共 ${total} 篇`);
    } else {
      setStatus('done-ok', '扫描完成，未发现中风险及以上内容', `共 ${total} 篇`);
    }

  }catch(err){
    document.getElementById('articleList').innerHTML =
      `<div class="error-msg">扫描失败：${esc(String(err?.message||err))}</div>`;
    setStatus('done-warn', '扫描失败');
  } finally {
    document.getElementById('btnScan').disabled = false;
    document.getElementById('btnScan').textContent = '开始扫描';
  }
}

document.getElementById('urlInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') startScan();
});
</script>
</body>
</html>
