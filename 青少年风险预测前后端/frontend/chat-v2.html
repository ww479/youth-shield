<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青年心盾 · 智能问答</title>
<script src="lib/chart.umd.min.js" defer></script>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS  — 青年心盾 v2  深矿琥珀系
═══════════════════════════════════════════════ */
:root {
  /* ── Surfaces (dark blue-slate mineral) ── */
  --bg:     oklch(9%  0.006 265);   /* ground */
  --sur-0:  oklch(12% 0.007 265);   /* header / sidebar base */
  --sur-1:  oklch(15% 0.009 265);   /* card */
  --sur-2:  oklch(19% 0.011 265);   /* input, raised */
  --sur-3:  oklch(24% 0.012 265);   /* hover, active */

  /* ── Amber — primary accent ── */
  --amber:      oklch(77% 0.155 72);
  --amber-dim:  oklch(65% 0.13  72);
  --amber-pale: oklch(85% 0.08  72);

  /* ── Teal — success / completion ── */
  --teal:     oklch(67% 0.10 188);
  --teal-dim: oklch(55% 0.09 188);

  /* ── Text ── */
  --ink:   oklch(93% 0     0);
  --ink-2: oklch(79% 0.005 265);
  --ink-3: oklch(60% 0.007 265);  /* passes 4.5:1 on --sur-1 */
  --ink-4: oklch(43% 0.008 265);  /* disabled */

  /* ── Borders ── */
  --rule:       oklch(100% 0 0 / 0.07);
  --rule-2:     oklch(100% 0 0 / 0.14);
  --rule-amber: oklch(77% 0.155 72 / 0.28);

  /* ── Risk semantic ── */
  --risk-h: oklch(62% 0.19 25);
  --risk-m: oklch(72% 0.16 65);
  --risk-l: oklch(65% 0.13 155);
  --risk-vl: oklch(65% 0.10 240);

  /* ── Type scale ── */
  --t-22: 22px;
  --t-15: 15px;
  --t-13: 13px;
  --t-12: 12px;
  --t-11: 11px;

  /* ── Radii ── */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 9999px;

  /* ── Shadows ── */
  --sh-sm: 0 2px 6px  oklch(0% 0 0 / 0.35);
  --sh-md: 0 6px 20px oklch(0% 0 0 / 0.40);
  --sh-lg: 0 12px 36px oklch(0% 0 0 / 0.50);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { height: 100%; scroll-behavior: smooth; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  font-size: var(--t-13);
  line-height: 1.6;
  color: var(--ink-2);
  background: var(--bg);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════
   Z-INDEX SCALE
═══════════════════════════════════════════════ */
/* dropdown 10 | sticky 20 | modal-backdrop 30 | modal 40 | toast 50 | tooltip 60 */

/* ═══════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════ */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 52px;
  background: var(--sur-0);
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: var(--r-md);
  background: var(--amber);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.brand-name {
  font-size: var(--t-15);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.2px;
}

.brand-tagline {
  font-size: var(--t-11);
  color: var(--ink-4);
  margin-top: 1px;
}

.site-nav {
  display: flex;
  align-items: center;
  gap: 2px;
}

.nav-link {
  padding: 6px 12px;
  border-radius: var(--r-md);
  font-size: var(--t-13);
  color: var(--ink-3);
  transition: background 0.15s, color 0.15s;
}

.nav-link:hover {
  background: var(--sur-2);
  color: var(--ink);
}

.nav-link.active {
  color: var(--amber);
  font-weight: 600;
}

.ai-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--bg);
  background: var(--amber);
  padding: 2px 7px;
  border-radius: var(--r-full);
  margin-left: 4px;
}

/* ═══════════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════════ */
.shell {
  flex: 1;
  display: flex;
  overflow: hidden;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: 0 20px;
  gap: 16px;
  min-height: 0;
}

/* ═══════════════════════════════════════════════
   SIDEBAR PANEL
═══════════════════════════════════════════════ */
.panel {
  width: 232px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 0;
  min-height: 0;
  overflow: hidden;
}

.panel-card {
  background: var(--sur-0);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}

.panel-head-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  flex-shrink: 0;
}

.panel-head-title {
  font-size: var(--t-12);
  font-weight: 700;
  color: var(--ink);
}

.panel-body {
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 0;
  flex: 1;
  min-height: 0;
}

/* ── Filter chips ── */
.filter-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 6px;
  flex-shrink: 0;
}

.dp-filter-btn {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: var(--r-full);
  border: 1px solid var(--rule-2);
  background: transparent;
  color: var(--ink-3);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap;
  line-height: 1.5;
}

.dp-filter-btn.active {
  background: var(--amber);
  color: var(--bg);
  border-color: transparent;
  font-weight: 600;
}

.dp-filter-btn:hover:not(.active) {
  border-color: var(--rule-amber);
  color: var(--amber);
  background: oklch(77% 0.155 72 / 0.08);
}

/* ── Case scroll ── */
.case-scroll {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.case-scroll::-webkit-scrollbar { width: 3px; }
.case-scroll::-webkit-scrollbar-track { background: transparent; }
.case-scroll::-webkit-scrollbar-thumb { background: var(--sur-3); border-radius: var(--r-full); }

/* ── Case items (JS generated as .dp-case) ── */
.dp-case {
  padding: 8px 6px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  border-radius: var(--r-md);
  margin: 0 2px;
  transition: background 0.1s;
}

.dp-case:last-child { border-bottom: none; }

.dp-case:hover { background: var(--sur-2); }

.dp-case-name {
  font-size: var(--t-12);
  font-weight: 600;
  color: var(--ink-2);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.dp-case-meta {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
  align-items: center;
}

.dp-case-domain {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: var(--r-full);
  border: 1px solid;
  white-space: nowrap;
}

.dp-case-lv {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: var(--r-full);
}

.dp-case-lv.hi { background: oklch(62% 0.19 25 / 0.15); color: var(--risk-h); }
.dp-case-lv.md { background: oklch(72% 0.16 65 / 0.15); color: var(--risk-m); }
.dp-case-lv.lo { background: oklch(65% 0.13 155 / 0.15); color: var(--risk-l); }

/* ── Skeleton shimmer ── */
.dp-skeleton {
  height: 10px;
  border-radius: var(--r-sm);
  background: linear-gradient(
    90deg,
    var(--sur-2) 25%,
    var(--sur-3) 50%,
    var(--sur-2) 75%
  );
  background-size: 400px 100%;
  animation: shimmer 1.4s infinite linear;
  margin-bottom: 8px;
}
.dp-skeleton:last-child { width: 60%; margin-bottom: 0; }

@keyframes shimmer {
  from { background-position: -200px 0; }
  to   { background-position:  200px 0; }
}

@media (max-width: 860px) { .panel { display: none; } }

/* ═══════════════════════════════════════════════
   MAIN CHAT COLUMN
═══════════════════════════════════════════════ */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

/* ── Chip bar ── */
.chip-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  padding: 8px 0 9px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}

.chip-label {
  font-size: var(--t-11);
  color: var(--ink-4);
  white-space: nowrap;
  flex-shrink: 0;
  margin-right: 2px;
}

.sug-chip {
  padding: 5px 12px;
  min-height: 30px;
  border-radius: var(--r-full);
  font-size: var(--t-12);
  font-weight: 500;
  background: var(--sur-1);
  color: var(--ink-2);
  border: 1px solid var(--rule-2);
  transition: background 0.13s, color 0.13s, border-color 0.13s;
  white-space: nowrap;
}

.sug-chip:hover {
  background: var(--amber);
  color: var(--bg);
  border-color: transparent;
}

/* ── Chat area ── */
.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 0 8px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--sur-3); border-radius: var(--r-full); }

/* ═══════════════════════════════════════════════
   MESSAGE BUBBLES
═══════════════════════════════════════════════ */
.msg-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-top: 2px;
}

.avatar.ai {
  background: var(--amber);
  color: var(--bg);
}

.avatar.user {
  background: var(--sur-2);
  color: var(--ink-3);
  border: 1px solid var(--rule-2);
}

.bubble {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: var(--r-lg);
  font-size: var(--t-13);
  line-height: 1.7;
  word-break: break-word;
  overflow-wrap: break-word;
}

.bubble.ai {
  background: var(--sur-1);
  border: 1px solid var(--rule);
  border-bottom-left-radius: var(--r-sm);
  color: var(--ink-2);
}

.bubble.user {
  background: var(--amber);
  color: var(--bg);
  border-bottom-right-radius: var(--r-sm);
  font-weight: 500;
}

/* ═══════════════════════════════════════════════
   REPLY BLOCK (rich AI response)
═══════════════════════════════════════════════ */
.reply-block {
  max-width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

/* ── Thinking panel ── */
.thinking-wrap {
  background: oklch(77% 0.155 72 / 0.06);
  border: 1px solid var(--rule-amber);
  border-radius: var(--r-lg);
  padding: 9px 12px;
  transition: border-color 0.2s;
}

.thinking-header {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
}

.thinking-icon {
  width: 20px;
  height: 20px;
  border-radius: var(--r-sm);
  background: var(--amber);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
  color: var(--bg);
}

.thinking-title {
  font-size: var(--t-12);
  font-weight: 700;
  color: var(--amber);
}

.thinking-status {
  flex: 1;
  font-size: var(--t-11);
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 0 4px;
  transition: color 0.15s;
}

.thinking-toggle {
  font-size: 10px;
  color: var(--ink-4);
  transition: transform 0.2s;
  flex-shrink: 0;
}

.thinking-wrap.folded .thinking-toggle { transform: rotate(-90deg); }

.thinking-steps {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  transition: max-height 0.28s ease;
}

.thinking-wrap.folded .thinking-steps {
  max-height: 0 !important;
  margin-top: 0;
}

.thinking-step {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 3px 5px;
  border-radius: var(--r-sm);
  animation: stepIn 0.18s ease;
  font-size: var(--t-11);
  color: var(--ink-3);
  line-height: 1.5;
}

.thinking-step.step-tool {
  background: oklch(77% 0.155 72 / 0.08);
  border: 1px solid var(--rule-amber);
}

.step-icon {
  flex-shrink: 0;
  width: 14px;
  text-align: center;
  font-size: 10px;
  margin-top: 1px;
}

.step-text { flex: 1; color: var(--ink-2); }

.step-preview {
  font-family: 'SF Mono', 'Consolas', monospace;
  font-size: 10px;
  color: var(--ink-3);
  background: var(--sur-2);
  border-radius: var(--r-sm);
  padding: 2px 5px;
  margin-top: 3px;
  word-break: break-all;
}

/* ── Spinner ── */
.thinking-spin {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid oklch(77% 0.155 72 / 0.2);
  border-top-color: var(--amber);
  animation: spin 0.7s linear infinite;
}

.thinking-spin.done {
  border: 2px solid oklch(67% 0.1 188 / 0.4);
  border-top-color: transparent;
  animation: none;
  background: oklch(67% 0.1 188 / 0.2);
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes stepIn {
  from { opacity: 0; transform: translateY(3px); }
  to   { opacity: 1; transform: none; }
}

/* ── Streaming answer ── */
.answer-streaming {
  background: var(--sur-1);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  font-size: var(--t-13);
  color: var(--ink-2);
  line-height: 1.78;
  min-height: 40px;
  word-break: break-word;
  overflow-wrap: break-word;
}

.answer-streaming p { margin-bottom: 8px; }
.answer-streaming p:last-child { margin-bottom: 0; }

.stream-cursor {
  display: inline-block;
  width: 2px;
  height: 0.9em;
  background: var(--amber);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 0.65s step-end infinite;
  border-radius: 1px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ── Answer card ── */
.answer-card {
  background: var(--sur-1);
  border: 1px solid var(--rule);
  border-top: 2px solid var(--amber);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.answer-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px 9px;
  border-bottom: 1px solid var(--rule);
}

.answer-header .icon {
  width: 24px;
  height: 24px;
  border-radius: var(--r-sm);
  background: oklch(77% 0.155 72 / 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.answer-header .title {
  font-size: var(--t-13);
  font-weight: 700;
  color: var(--ink);
}

.domain-badge {
  margin-left: auto;
  font-size: var(--t-11);
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-weight: 600;
  background: oklch(77% 0.155 72 / 0.12);
  color: var(--amber);
  border: 1px solid var(--rule-amber);
}

.answer-body {
  padding: 12px 14px;
  color: var(--ink-2);
  font-size: var(--t-13);
  line-height: 1.78;
  word-break: break-word;
  overflow-wrap: break-word;
}

.answer-body p { margin-bottom: 8px; }
.answer-body p:last-child { margin-bottom: 0; }

/* ── Key points ── */
.key-points {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 14px 12px;
}

.kp-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  background: var(--sur-2);
  border-radius: var(--r-md);
  padding: 7px 10px;
  font-size: var(--t-13);
  color: var(--ink-2);
}

.kp-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--amber);
  flex-shrink: 0;
  margin-top: 7px;
}

/* ── Tags ── */
.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 3px 0;
}

.tag-chip {
  padding: 3px 9px;
  border-radius: var(--r-full);
  font-size: var(--t-11);
  background: oklch(77% 0.155 72 / 0.1);
  color: var(--amber-pale);
  border: 1px solid var(--rule-amber);
}

/* ── Guidance tip ── */
.guidance-tip {
  padding: 8px 14px 12px;
  font-size: var(--t-12);
  color: var(--ink-3);
  line-height: 1.6;
}

/* ── Script card / Chart card ── */
.cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

@media (max-width: 640px) { .cards-row { grid-template-columns: 1fr; } }

.script-card, .chart-card {
  background: var(--sur-1);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 12px 0;
  font-size: var(--t-12);
  font-weight: 700;
  color: var(--ink);
}

.card-header-icon { font-size: 14px; }

.age-tabs {
  display: flex;
  gap: 3px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--rule);
}

.age-tab {
  padding: 4px 10px;
  min-height: 28px;
  border-radius: var(--r-full);
  font-size: var(--t-11);
  font-weight: 500;
  background: transparent;
  color: var(--ink-3);
  border: none;
  transition: background 0.13s, color 0.13s;
}

.age-tab.active {
  background: var(--amber);
  color: var(--bg);
}

.age-tab:hover:not(.active) {
  background: var(--sur-3);
  color: var(--ink);
}

.script-body {
  padding: 10px 12px;
  font-size: var(--t-12);
  color: var(--ink-2);
  line-height: 1.7;
  min-height: 68px;
}

.empty-script {
  color: var(--ink-4);
  font-style: italic;
  font-size: var(--t-12);
}

.chart-body { padding: 8px 10px 12px; }
.chart-wrap { position: relative; height: 110px; }

.no-chart {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 80px;
  color: var(--ink-4);
  font-size: var(--t-12);
}

/* ── Cases section ── */
.cases-section { margin-top: 4px; }

.cases-title {
  font-size: var(--t-12);
  font-weight: 700;
  color: var(--ink-3);
  padding: 0 2px 7px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.cases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 7px;
}

.case-card {
  background: var(--sur-1);
  border-radius: var(--r-md);
  border: 1px solid var(--rule);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color 0.13s, background 0.13s;
  cursor: pointer;
}

.case-card:hover {
  border-color: var(--rule-amber);
  background: var(--sur-2);
}

.case-level-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: var(--r-full);
  letter-spacing: 0.2px;
}

.lv-h { background: oklch(62% 0.19 25  / 0.15); color: var(--risk-h); }
.lv-m { background: oklch(72% 0.16 65  / 0.15); color: var(--risk-m); }
.lv-l { background: oklch(65% 0.13 155 / 0.15); color: var(--risk-l); }

.case-name {
  font-size: var(--t-13);
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
}

.case-domain {
  font-size: var(--t-11);
  color: var(--ink-3);
  margin-top: 1px;
}

.case-snippet {
  font-size: var(--t-12);
  color: var(--ink-3);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── Rank card ── */
.rank-card {
  background: var(--sur-1);
  border: 1px solid var(--rule);
  border-top: 2px solid var(--amber-dim);
  border-radius: var(--r-lg);
  overflow: hidden;
}

.rank-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px 9px;
  border-bottom: 1px solid var(--rule);
}

.rank-header .icon {
  width: 26px;
  height: 26px;
  border-radius: var(--r-sm);
  background: oklch(77% 0.155 72 / 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.rank-header .title {
  font-size: var(--t-13);
  font-weight: 700;
  color: var(--ink);
}

.rank-summary {
  padding: 9px 16px;
  font-size: var(--t-13);
  color: var(--ink-2);
  line-height: 1.65;
  border-bottom: 1px solid var(--rule);
}

.rank-list { padding: 4px 0; }

.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  transition: background 0.1s;
  cursor: pointer;
}

.rank-item:hover { background: var(--sur-2); }

.rank-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  flex-shrink: 0;
}

.rank-num.top1 { background: oklch(77% 0.155 72); color: var(--bg); }
.rank-num.top2 { background: oklch(55% 0.01 265); color: var(--ink); }
.rank-num.top3 { background: oklch(45% 0.05 55);  color: var(--ink); }
.rank-num.rest { background: var(--sur-2); color: var(--ink-3); font-size: 10px; }

.rank-info { flex: 1; min-width: 0; }

.rank-name {
  font-size: var(--t-13);
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rank-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
  flex-wrap: wrap;
}

.rank-meta-tag { font-size: var(--t-11); color: var(--ink-3); }

.rank-value {
  flex-shrink: 0;
  font-size: var(--t-13);
  font-weight: 700;
  color: var(--amber);
  text-align: right;
  min-width: 52px;
}

.rank-bar-wrap { padding: 0 16px 12px; }

.rank-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.rank-bar-label {
  font-size: var(--t-11);
  color: var(--ink-3);
  width: 88px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rank-bar-track {
  flex: 1;
  height: 5px;
  background: var(--sur-2);
  border-radius: var(--r-full);
  overflow: hidden;
}

.rank-bar-fill {
  height: 100%;
  border-radius: var(--r-full);
  background: var(--amber-dim);
  transition: width 0.5s cubic-bezier(.2, 0, .4, 1);
}

.rank-bar-val {
  font-size: var(--t-11);
  color: var(--ink-3);
  width: 40px;
  text-align: right;
  flex-shrink: 0;
}

/* ── Loading dots ── */
.loading-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 3px 0;
}

.loading-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  animation: dotPulse 1.2s cubic-bezier(.2, 0, .8, 1) infinite;
}

.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }

@keyframes dotPulse {
  0%, 100% { transform: translateY(0); opacity: 0.35; }
  40%       { transform: translateY(-5px); opacity: 1; }
}

/* ── Platform icons ── */
.plat-icon {
  width: 14px;
  height: 14px;
  border-radius: var(--r-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  letter-spacing: 0;
  line-height: 1;
}

.pi-weibo   { background: #E11D48; }
.pi-douyin  { background: #222; }
.pi-xhs     { background: #FF2442; }
.pi-bili    { background: #00A1D6; }
.pi-baidu   { background: #2932E1; }
.pi-wx      { background: #07C160; }
.pi-default { background: var(--sur-3); }

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */
.welcome-bubble-wrap {

.wb-greeting {

<script>
const API = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
let msgCount = 0;
let deepMode = false;

// ── 平台图标 ──
const PLAT_ICON = {
  '微博':       ['pi-weibo',  '微'],
  '抖音':       ['pi-douyin', '抖'],
  '小红书':     ['pi-xhs',    '红'],
  'B站':        ['pi-bili',   'B'],
  'bilibili':   ['pi-bili',   'B'],
  '百度':       ['pi-baidu',  '百'],
  '微信公众号': ['pi-wx',     '信'],
  '微信':       ['pi-wx',     '信'],
};

function platIcon(platform) {
  const p = platform || '';
  const [cls, txt] = PLAT_ICON[p] || ['pi-default', p.slice(0, 1) || '?'];
  return `<span class="plat-icon ${cls}">${txt}</span>`;
}

// ── 清空会话 ──
function clearChat() {
  if (!confirm('清空本次会话记录？')) return;
  document.getElementById('chatArea').innerHTML = `
    <div id="welcome" class="welcome-bubble-wrap">
      <div class="avatar ai" aria-hidden="true">AI</div>
      <div class="welcome-bubble">
        <div class="wb-greeting">你好，我是<strong>青年心盾</strong>智能助手</div>
        <div class="wb-desc">专注青少年心理健康与网络价值观引导，基于专业数据库为您提供分析与建议。</div>
        <div class="wb-stats" aria-label="数据库概况">
          <span class="wb-stat"><span class="wb-stat-num">81</span> 典型案例</span>
          <span class="wb-dot" aria-hidden="true">·</span>
          <span class="wb-stat"><span class="wb-stat-num">181</span> 引导话术</span>
          <span class="wb-dot" aria-hidden="true">·</span>
          <span class="wb-stat"><span class="wb-stat-num">59K+</span> 条语料</span>
        </div>
        <div class="wb-hints">
          <button class="wb-hint" onclick="ask('青少年常见的心理风险有哪些？')">🔍 青少年常见心理风险有哪些？</button>
          <button class="wb-hint" onclick="ask('不同年龄段青少年的引导策略有何差异？')">📋 不同年龄段的引导策略差异？</button>
          <button class="wb-hint" onclick="ask('家长和教师如何配合进行心理健康教育？')">🤝 家校如何协作开展心理健康教育？</button>
        </div>
      </div>
    </div>`;
  msgCount = 0;
}

// ── 模式切换 ──
function toggleMode() {
  deepMode = !deepMode;
  const btn = document.getElementById('modeBtn');
  const txt = document.getElementById('modeTxt');
  btn.classList.toggle('active-mode', deepMode);
  btn.setAttribute('aria-pressed', deepMode);
  txt.textContent = deepMode ? '深度' : '普通';
}

// ══════════════════════════════════════════
//  案例侧边栏
// ══════════════════════════════════════════
const DCLR = {
  '制度认同风险': '#3D6FD4', '历史认知风险': '#EA580C',
  '心理韧性风险': '#7C3AED', '认知闭合风险': '#0891B2', '网络素养风险': '#059669'
};
const DSHORT = {
  '制度认同风险': '制度认同', '历史认知风险': '历史认知',
  '心理韧性风险': '心理韧性', '认知闭合风险': '认知闭合', '网络素养风险': '网络素养'
};
let _allCases = [];

async function loadDataPanel() {
  try {
    const data = await fetch(`${API}/cases`).then(r => r.json()).catch(() => null);
    if (!data || !data.cases) return;
    _allCases = data.cases;
    renderCaseFilters();
    renderCaseList('');
  } catch(e) { console.warn('案例侧边栏加载失败', e); }
}

function renderCaseFilters() {
  const domains = [...new Set(_allCases.map(c => c.risk_domain_l1).filter(Boolean))];
  const el = document.getElementById('dpCaseFilter');
  if (!el) return;
  el.innerHTML = `<button class="dp-filter-btn active" onclick="filterCases(&#39;&#39;, this)">全部</button>` +
    domains.map(d =>
      `<button class="dp-filter-btn" onclick="filterCases(&#39;${escHtml(d)}&#39;, this)"
         style="border-color:${hexA(DCLR[d]||'#64748b',.3)};color:${DCLR[d]||'#64748b'}">
        ${escHtml(DSHORT[d]||d)}
       </button>`
    ).join('');
}

window.filterCases = function(domain, btn) {
  document.querySelectorAll('.dp-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCaseList(domain);
};

function renderCaseList(domain) {
  const el = document.getElementById('dpCaseList');
  if (!el) return;
  const list = domain ? _allCases.filter(c => c.risk_domain_l1 === domain) : _allCases;
  if (!list.length) {

    '中度风险':['中度风险','md'],'轻度风险':['轻度风险','lo'],'低风险':['','lo']
  };

      : `onclick="ask('关于案例「${escHtml(c.case_name||'')}」请给我详细分析')"`;

function hexA(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

    'L4':['极高风险','lv-h'],'L3':['高风险','lv-h'],'L2':['中度风险','lv-m'],

    '高风险':['高风险','lv-h'],'极高风险':['极高风险','lv-h'],

  };

  function getVal(c) {
    if (orderField === 'total_interaction') return c.total_interaction||0;

    const numClass = ['top1','top2','top3'][i] || 'rest';
    const numIcon  = ['🥇','🥈','🥉'][i] || `${i+1}`;

      <div class="rank-bar-label" title="${escHtml(c.case_name||'')}">${escHtml(name)}</div>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
      <div class="rank-bar-val">${Number(val).toLocaleString()}</div>
    </div>`;
  }).join('');

  row.outerHTML = `
    <div class="msg-row" id="${id}">
      <div class="avatar ai" aria-hidden="true">AI</div>
      <div class="reply-block">
        <div class="rank-card">
          <div class="rank-header">

          </div>

  document.getElementById(tabContId).querySelectorAll('.age-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const msgId = tabContId.replace('tabs-','msg-');
  const fn = window['__scriptBodyFn_'+msgId];
  if (fn) document.getElementById(bodyId).innerHTML = fn(ageLabel);

function formatAnswer(text) {
  if (!text) return '';
  return text.split(/\n+/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p style="margin-bottom:8px;">${escHtml(p)}</p>`).join('');
}

function escHtml(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function sendMessage() {
  const q = chatInput.value.trim();
  if (!q) return;
  const sendBtn = document.getElementById('sendBtn');

  chatInput.value = '';
  chatInput.style.height = 'auto';
  sendBtn.disabled = true;

  appendUserMsg(q);

  const msgId = 'msg-' + (++msgCount);
  const thinkId      = 'think-' + msgId;
  const thinkStepsId = 'tsteps-' + msgId;
  const thinkSpinId  = 'tspin-'  + msgId;
  const thinkStatusId= 'tstat-'  + msgId;
  const answerId     = 'ans-'    + msgId;
  const cardsId      = 'cards-'  + msgId;

  const msgEl = document.createElement('div');
  msgEl.id = msgId;
  msgEl.className = 'msg-row';
  msgEl.innerHTML = `
    <div class="avatar ai" aria-hidden="true">AI</div>
    <div class="reply-block">
      <div class="thinking-wrap folded" id="${thinkId}">
        <div class="thinking-header" onclick="toggleThinking('${thinkId}')">
          <div class="thinking-icon">🧠</div>
          <span class="thinking-title">思考中</span>
          <span class="thinking-status" id="${thinkStatusId}">分析中…</span>
          <div class="thinking-spin" id="${thinkSpinId}"></div>
          <span class="thinking-toggle">▼</span>
        </div>
        <div class="thinking-steps" id="${thinkStepsId}"></div>
      </div>
      <div class="answer-streaming" id="${answerId}" style="display:none"></div>
      <div id="${cardsId}"></div>
    </div>`;

  document.getElementById('chatArea').appendChild(msgEl);
  scrollToBottom();

  let answerText = '';
  let thinkingDone = false;

  function addThinkStep(text, isTool, preview) {
    const statusEl = document.getElementById(thinkStatusId);
    if (statusEl) statusEl.textContent = text.length > 24 ? text.slice(0,22)+'…' : text;
    const stepsEl = document.getElementById(thinkStepsId);
    const step = document.createElement('div');
    step.className = 'thinking-step' + (isTool ? ' step-tool' : '');
    const icon = isTool ? '🔧' : (text.startsWith('✓') ? '✅' : '◎');
    step.innerHTML = `
      <span class="step-icon">${icon}</span>
      <div class="step-text">
        ${escHtml(text)}
        ${preview ? `<div class="step-preview">${escHtml(preview)}</div>` : ''}
      </div>`;
    stepsEl.appendChild(step);
    scrollToBottom();
  }

  function finalizeThinking() {
    thinkingDone = true;
    const spinEl = document.getElementById(thinkSpinId);
    if (spinEl) spinEl.classList.add('done');
    const titleEl = document.getElementById(thinkId)?.querySelector('.thinking-title');
    if (titleEl) titleEl.textContent = '已完成';
    const statusEl = document.getElementById(thinkStatusId);
    if (statusEl) statusEl.style.color = 'var(--ink-4)';

    const el = document.getElementById(answerId);

    if (el.style.display === 'none') {
      el.style.display = 'block';
      el.innerHTML = '<span class="stream-cursor"></span>';
    }
    answerText += text;
    const cursor = el.querySelector('.stream-cursor');

      cursor.before(document.createTextNode(text));

      '中度风险':['中度风险','lv-m'],'轻度风险':['轻度风险','lv-l'],'低风险':['低风险','lv-l']
    };
    const casesHtml = cases.length
      ? `<div class="cases-section">
          <div class="cases-title">📂 相关典型案例</div>
          <div class="cases-grid">` +
        cases.map(c => {
          const rl = RISK_LABEL[c.risk_level]||['未知','lv-l'];
          const oc = c.source_url?`onclick="window.open('${escHtml(c.source_url)}','_blank')"` : '';
          return `<div class="case-card" ${oc}>
            <div><span class="case-level-badge ${rl[1]}">${rl[0]}</span></div>
            <div class="case-name">${escHtml(c.case_name||'')}</div>
            <div class="case-domain">${escHtml(c.risk_domain||'')} · ${escHtml(c.risk_type||'')}</div>
            <div class="case-snippet">${escHtml(c.representative_text||'暂无摘要')}</div>
          </div>`;
        }).join('') + `</div></div>` : '';

    container.innerHTML = `${kpHtml}${tagsHtml}${cardsRowHtml}${casesHtml}`;
    window['__sBodyFn_'+msgId] = scriptBodyFor;

    if (chartData.length) {
      requestAnimationFrame(() => {
        const ctx = document.getElementById(chartId);
        if (!ctx) return;
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: chartData.map(d=>d.domain.replace('风险','')),
            datasets: [{
              data: chartData.map(d=>d.score),
              backgroundColor: ['rgba(200,150,80,.75)','rgba(80,160,200,.7)','rgba(100,180,120,.7)','rgba(210,150,60,.7)','rgba(200,80,80,.7)'],
              borderRadius: 3, borderSkipped: false
            }]
          },
          options: {
            indexAxis:'y', responsive:true, maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{
              x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{font:{size:9},color:'rgba(255,255,255,.35)'}},
              y:{ticks:{font:{size:10},color:'rgba(255,255,255,.55)'},grid:{display:false}}
            }
          }
        });
      });
    }
  }

  try {
    const resp = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: q, age_group: '13-15' }),
    });
    if (!resp.ok) throw new Error('服务异常 ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (!raw || raw === '[DONE]') continue;
        try {
          const ev = JSON.parse(raw);
          if (ev.type === 'heartbeat')      continue;
          if (ev.type === 'thinking')       addThinkStep(ev.text, false, null);
          else if (ev.type === 'thinking_tool') addThinkStep(ev.text, true, ev.preview||null);
          else if (ev.type === 'thinking_done') finalizeThinking();
          else if (ev.type === 'answer_chunk') appendChunk(ev.text);
          else if (ev.type === 'result')    renderCards(ev.data);
          else if (ev.type === 'error')     addThinkStep('⚠️ '+(ev.text||'出错'), false, null);
        } catch {}
      }
    }
    if (!thinkingDone) finalizeThinking();

  } catch (e) {
    const eStr = String(e);
    const errMsg = (eStr.includes('服务异常')||eStr.includes('500')||eStr.includes('502')||eStr.includes('503'))
      ? '服务暂时不可用，请稍后再试'
      : (eStr.includes('fetch')||eStr.includes('network')||eStr.includes('NetworkError'))
      ? '网络连接失败，请检查网络后重试'
      : '请求出错，请稍后重试';
    const row = document.getElementById(msgId);
    if (row) {
      const rb = row.querySelector('.reply-block');
      if (rb) rb.innerHTML = `
        <div style="background:oklch(62% 0.19 25/0.1);border:1px solid oklch(62% 0.19 25/0.3);border-radius:var(--r-lg);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;">
          <span style="font-size:16px;flex-shrink:0;line-height:1.4;">⚠️</span>
          <div>
            <div style="font-size:var(--t-13);font-weight:600;color:var(--risk-h);margin-bottom:4px;">${escHtml(errMsg)}</div>
            <div style="font-size:var(--t-12);color:var(--ink-3);">您的问题已保留在输入框，可直接重新发送。</div>
          </div>
        </div>`;
    }
    if (!chatInput.value.trim()) chatInput.value = q;
  } finally {
    sendBtn.disabled = false;
    chatInput.focus();
    scrollToBottom();
  }
}

window.toggleThinking = function(wrapId) {
  const el = document.getElementById(wrapId);
  if (el) el.classList.toggle('folded');
};

window.switchAgeR = function(tabsId, bodyId, ageLabel, btn) {
  document.getElementById(tabsId).querySelectorAll('.age-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const msgId = tabsId.replace('rtabs-','');
  const fn = window['__sBodyFn_'+msgId];
  if (fn) document.getElementById(bodyId).innerHTML = fn(ageLabel);
};
</script>
</body>
</html>
